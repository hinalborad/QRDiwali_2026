<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#091036">
  <title>Happy Diwali 2026</title>
  <meta name="description" content="Light the diya, watch fireworks dance to the music and draw your own rangoli.">
  <meta property="og:title" content="Happy Diwali 2026 🪔">
  <meta property="og:description" content="A little Diwali surprise — tap to light the diya!">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <!-- Shared gradients for the brass diyas and gold ornaments -->
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <!-- Bronze diya: round-bowl shading, warm light from above, a purple glow reflected from below -->
      <linearGradient id="gBronzeBody" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2a1303"/>
        <stop offset=".12" stop-color="#6a3a12"/>
        <stop offset=".3" stop-color="#b47629"/>
        <stop offset=".42" stop-color="#e3b05a"/>
        <stop offset=".5" stop-color="#f2c873"/>
        <stop offset=".6" stop-color="#c88a35"/>
        <stop offset=".8" stop-color="#6e3c12"/>
        <stop offset="1" stop-color="#2a1303"/>
      </linearGradient>
      <linearGradient id="gBronzeShade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd282" stop-opacity=".45"/>
        <stop offset=".3" stop-color="#ffbe6e" stop-opacity=".05"/>
        <stop offset=".72" stop-color="#1e0c03" stop-opacity=".25"/>
        <stop offset="1" stop-color="#50328c" stop-opacity=".45"/>
      </linearGradient>
      <linearGradient id="gBronzeRim" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#5a2e0b"/>
        <stop offset=".2" stop-color="#c98d3c"/>
        <stop offset=".38" stop-color="#ffe3a0"/>
        <stop offset=".5" stop-color="#fff3cc"/>
        <stop offset=".62" stop-color="#f0bd62"/>
        <stop offset=".85" stop-color="#8a5118"/>
        <stop offset="1" stop-color="#4a2508"/>
      </linearGradient>
      <radialGradient id="gInterior" cx=".5" cy=".3" r=".8">
        <stop offset="0" stop-color="#6b3b12"/>
        <stop offset=".6" stop-color="#3e2108"/>
        <stop offset="1" stop-color="#1f0f03"/>
      </radialGradient>
      <radialGradient id="gInteriorGlow" cx=".5" cy=".62" r=".62">
        <stop offset="0" stop-color="#fff4c8" stop-opacity=".95"/>
        <stop offset=".3" stop-color="#ffce6e" stop-opacity=".85"/>
        <stop offset=".68" stop-color="#d68c32" stop-opacity=".5"/>
        <stop offset="1" stop-color="#964f14" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="gFoot" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c58a3a"/>
        <stop offset="1" stop-color="#3e1f06"/>
      </linearGradient>
      <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff0c4"/>
        <stop offset=".5" stop-color="#f2c66d"/>
        <stop offset="1" stop-color="#b9822f"/>
      </linearGradient>
      <radialGradient id="gPendantGlow">
        <stop offset="0" stop-color="#ffd27a" stop-opacity=".5"/>
        <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
      </radialGradient>
    </defs>
  </svg>

  <!-- The scene: navy sky, distant lights, a wet floor with a rangoli -->
  <div class="sky" aria-hidden="true"></div>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="bokeh" id="bokeh" aria-hidden="true"></div>
  <div class="floor" aria-hidden="true">
    <div class="floor-glow" id="floorGlow"></div>
    <svg class="floor-mandala" id="floorMandala" viewBox="-100 -100 200 200"></svg>
  </div>
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <div class="flash" id="flash" aria-hidden="true"></div>
  <div class="hangings" id="hangings" aria-hidden="true"></div>
  <div class="sparkles" id="sparkles" aria-hidden="true"></div>

  <div class="top-controls">
    <button class="round-btn" id="fullBtn" type="button" aria-label="Full screen" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="round-btn" id="soundBtn" type="button" aria-label="Mute music" hidden>🔊</button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <main class="content">
    <div class="panel" id="panel">
      <p class="eyebrow greet" aria-label="Happy Diwali in Indian languages">
        <span class="orn" aria-hidden="true">✦</span><span class="g" id="greetText" lang="hi">शुभ दीपावली</span><span class="orn" aria-hidden="true">✦</span>
      </p>
      <h1 class="title">Happy <span class="gold">Diwali</span></h1>
      <p class="subtitle">May the Festival of Lights fill your life with joy, colour and prosperity</p>

      <section class="countdown" id="countdown" aria-label="Countdown to Diwali">
        <div class="unit"><span class="num" id="cd-d">00</span><span class="label">Days</span></div>
        <div class="unit"><span class="num" id="cd-h">00</span><span class="label">Hours</span></div>
        <div class="unit"><span class="num" id="cd-m">00</span><span class="label">Minutes</span></div>
        <div class="unit"><span class="num" id="cd-s">00</span><span class="label">Seconds</span></div>
      </section>

      <ol class="festival" id="festival" aria-label="The five days of Diwali"></ol>

      <button class="pill cta" id="drawBtn" type="button">🎨 Draw your Rangoli</button>
    </div>
  </main>

  <div class="diyas" id="diyas"></div>

  <!-- Opening: the visitor lights the diya, which also starts the music -->
  <div class="intro" id="intro">
    <div class="intro-copy">
      <p class="eyebrow"><span class="orn" aria-hidden="true">✦</span>A little Diwali surprise<span class="orn" aria-hidden="true">✦</span></p>
      <h2 class="intro-title">Light the diya,<span class="gold">let the joy begin.</span></h2>
      <p class="intro-sub">Tap the diya below and turn your sound on 🔊</p>
    </div>
    <button class="big-diya" id="introDiya" type="button" aria-label="Light the diya to begin">
      <span class="glow"></span>
      <span class="fw"><span class="flame"></span></span>
      <span class="light-wave"></span>
    </button>
  </div>

  <!-- Rangoli studio -->
  <section class="studio" id="studio" role="dialog" aria-modal="true" aria-labelledby="studioTitle" hidden>
    <header class="studio-bar">
      <button class="round-btn" id="studioClose" type="button" aria-label="Close">✕</button>
      <h2 id="studioTitle">Draw your Rangoli</h2>
      <button class="chip" id="studioUndo" type="button">↩ Undo</button>
    </header>
    <div class="studio-stage" id="studioStage">
      <canvas id="rangoliCanvas" aria-label="Drawing area"></canvas>
      <canvas id="rangoliGuide" aria-hidden="true"></canvas>
    </div>
    <div class="studio-tools">
      <div class="tool-row" id="swatches" role="group" aria-label="Colour"></div>
      <div class="tool-row">
        <button class="chip" type="button" data-brush="line" aria-pressed="true">✏️ Line</button>
        <button class="chip" type="button" data-brush="dots" aria-pressed="false">• Dots</button>
        <button class="chip" type="button" data-brush="petal" aria-pressed="false">🌸 Petals</button>
        <button class="chip" type="button" id="symBtn" aria-label="Change symmetry">✳️ 8</button>
        <button class="chip" type="button" id="sizeBtn" aria-label="Change brush size">● M</button>
      </div>
      <div class="tool-row">
        <button class="chip" type="button" id="magicBtn">✨ Magic</button>
        <button class="chip" type="button" id="clearBtn">🗑️ Clear</button>
        <button class="chip" type="button" id="saveBtn">💾 Save</button>
        <button class="chip primary" type="button" id="launchBtn">🎆 Light it up</button>
      </div>
    </div>
  </section>

  <audio id="music" preload="auto"></audio>
  <!-- ?v= makes browsers fetch the new files after an update; bump it when you change them -->
  <script src="js/beats.js?v=9"></script>
  <script src="js/fireworks.js?v=9"></script>
  <script src="js/rangoli.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
